{% extends 'barber_grid/base.html' %}

{% block title %}Editar perfil | Barber Grid{% endblock %}

{% block content %}
<div class="container my-4">
    <h2 class="mb-4">Editar perfil</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input
                type="text"
                id="nome"
                name="nome"
                class="form-control"
                value="{{ request.user.first_name }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                value="{{ request.user.email }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input
                type="text"
                id="telefone"
                name="telefone"
                class="form-control"
                value="{{ cliente.telefone }}"
                required
            >
        </div>

        <div class="d-flex gap-2">
            <a href="{% url 'usuario_historico' %}" class="btn btn-outline-secondary">
                Voltar
            </a>

            <button type="submit" class="btn btn-primary">
                Salvar alterações
            </button>
        </div>
    </form>
</div>
{% endblock %}
