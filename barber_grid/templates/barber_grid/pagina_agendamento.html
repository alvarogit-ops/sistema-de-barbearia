{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <title>Serviços | Barber Grid</title>
</head>
<body class="bg-body text-body">
    <div class="imagens_invisiveis">
   <img class="imagem_logotipo_escuro" src="{% static 'images/logo_tema_escuro.png' %}">
   <img class="imagem_logotipo_claro" src="{% static 'images/logo_tema_claro.png' %}">
 </div>



  <!--navbar próprio do bootstrap e material design bootstrap-->
  <nav class="text-center">
  <img id="imagem_logotipo" src="{% static 'images/logo_tema_escuro.png' %}">
     <a class="navbar-brand" href="{% url 'setup' %}">Barber Grid</a>
 </nav>
        <div class="container">
            <h4>Selecione um serviço</h4>
            <hr>
            <h5>Serviços</h5>
            <div class="card">
                <div class="card-img m-3 d-flex">
                    <div class="d-flex">
                         <img class="card-img-left" src="{% static 'images/haircut.jpg'%}" alt="Card image cap">
                        <div class="d-flex justify-content-between">
                            <div class="card-body w-100 text-left">
                                <div class="justify-content-between">
                                     <h5 class="card-title">Card title</h5>
                            <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
                    </div>
                            </div>
                                </div>
                           
                             <div id="chevron" class="d-flex">
                                  <i class="bi bi-chevron-right"></i>
                            </div>
                            </div> 
                        </div>
                      
                    </div>
                </div>   
                </div>
                        
           <div class="card">
                <div class="card-img m-3">
                    <div class="d-flex justify-content-between">
                         <img class="card-img-left" src="{% static 'images/beard.jpg'%}" alt="Card image cap">
                        <div class="d-flex justify-content-between">
                            <div class="card-body text-left">
                            <h5 class="card-title">Card title</h5>
                            <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
                            </div>
                             <div id="chevron" class="d-flex">
                                  <i class="bi bi-chevron-right"></i>
                            </div>
                            </div> 
                        </div>
                      
                    </div>
                </div>
<script>
    const temaEscuro = window.matchMedia('(prefers-color-scheme: dark)');
        function aplicarTema(escuro) {
          document.documentElement.setAttribute(
               "data-bs-theme",
              escuro ? "dark": "light",
            );
        }

        

        

        aplicarTema(temaEscuro.matches);

        temaEscuro.addEventListener("change", (evento) => {
            aplicarTema(evento.matches);
        });


        
</script>
</body>
</html>
