{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha redefinida | Barber Grid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body class="bg-body text-body">
    <main class="login-page">
        <div class="login-container">
            <div class="login-card text-center">
                <h1 class="h3 mb-3">Senha redefinida!</h1>
                <p>Sua senha foi alterada com sucesso.</p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100 login-button">
                    Ir para o login
                </a>
            </div>
        </div>
    </main>
</body>
<script>
    const temaEscuro = window.matchMedia(
        '(prefers-color-scheme: dark)'
    );

    function aplicarTema(escuro) {
        document.documentElement.setAttribute(
            "data-bs-theme",
            escuro ? "dark" : "light"
        );
    }

    aplicarTema(temaEscuro.matches);

    temaEscuro.addEventListener("change", (evento) => {
        aplicarTema(evento.matches);
    });
</script>
</html>
