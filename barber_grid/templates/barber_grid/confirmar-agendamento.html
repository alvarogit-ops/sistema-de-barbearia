{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar Agendamento | Barber Grid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="shortcut icon"
          type="image/png"
          href="{% static 'images/favicon.ico' %}">

    <link rel="stylesheet"
          href="{% static 'css/estilo.css' %}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&family=Montserrat:wght@100..900&family=Tangerine:wght@400;700&display=swap"
          rel="stylesheet">
</head>

<body class="bg-body text-body">

<nav data-bs-theme="dark"
     class="navbar navbar-expand-lg navbar-dark bg-black">

    <div class="container">

        <a class="navbar-brand"
           href="{% url 'inicio' %}">

            <img height="32"
                 class="me-2"
                 src="{% static 'images/favicon.ico' %}">

            Barber Grid

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
                aria-controls="menu"
                aria-expanded="false"
                aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="menu">

            <div class="me-auto navbar-nav">

                <a class="nav-link"
                   href="{% url 'inicio' %}">
                    Início
                </a>

                <a class="nav-link active"
                   href="{% url 'pagina_servicos' %}">
                    Agendar
                </a>

                <a class="nav-link"
                   href="{% url 'usuario_historico' %}">
                    Minhas reservas
                </a>

            </div>

            <div class="navbar-nav">

                <a class="nav-link"
                   href="#">

                    <i class="bi bi-person-circle text-secondary align-middle"
                       style="font-size: 24px; line-height: 1;">
                    </i>

                    {{ request.user.username }}

                </a>

            </div>

        </div>

    </div>

</nav>


<main>

    <div class="container py-4">

        <h1 class="mb-4">
            Confirmar Agendamento
        </h1>

        <div class="card">

            <div class="list-group list-group-flush">

                <div class="list-group-item">
                    <strong>Serviço:</strong>
                    {{ servico.nome_servico }}
                </div>

                <div class="list-group-item">
                    <strong>Barbeiro:</strong>
                    Felipe
                </div>

                <div class="list-group-item">
                    <strong>Dia:</strong>
                    {{ data }}
                </div>

                <div class="list-group-item">
                    <strong>Horário:</strong>
                    {{ horario }}
                </div>

                <div class="list-group-item">
                    <strong>Preço:</strong>
                    R$ {{ servico.preco }}
                </div>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <input type="hidden"
                           name="data"
                           value="{{ data }}">

                    <input type="hidden"
                           name="horario"
                           value="{{ horario }}">

                    <div class="d-flex gap-2">

                        <a href="{% url 'agendamento' servico_id %}"
                           class="btn btn-outline-secondary">

                            Voltar

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            Confirmar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>

</body>
</html>
