{% extends 'barber_grid/base_admin.html' %}

{% block title %}Novo serviço | Barber Grid{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="mb-4">
                <h2 class="fw-bold mb-1">Novo serviço</h2>
                <p class="text-muted mb-0">
                    Cadastre um serviço oferecido pela barbearia.
                </p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="nome_servico" class="form-label">
                                Nome do serviço
                            </label>

                            <input
                                type="text"
                                id="nome_servico"
                                name="nome_servico"
                                class="form-control"
                                maxlength="80"
                                placeholder="Ex.: Corte masculino"
                                value="{{ request.POST.nome_servico|default:'' }}"
                                required
                            >
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="duracao_minutos" class="form-label">
                                    Duração estimada (minutos)
                                </label>

                                <input
                                    type="number"
                                    id="duracao_minutos"
                                    name="duracao_minutos"
                                    class="form-control"
                                    min="1"
                                    placeholder="Ex.: 30"
                                    value="{{ request.POST.duracao_minutos|default:'' }}"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="preco" class="form-label">
                                    Preço (R$)
                                </label>

                                <input
                                    type="number"
                                    id="preco"
                                    name="preco"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    placeholder="Ex.: 35,00"
                                    value="{{ request.POST.preco|default:'' }}"
                                    required
                                >
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="imagem" class="form-label">
                                Imagem do serviço
                            </label>

                            <input
                                type="file"
                                id="imagem"
                                name="imagem"
                                class="form-control"
                                accept="image/*"
                            >

                            <div class="form-text">
                                Selecione uma imagem para representar o serviço.
                                Este campo é opcional.
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between flex-wrap gap-2">
                            <a
                                href="{% url 'painel_admin' %}"
                                class="btn btn-outline-secondary"
                            >
                                <i class="bi bi-arrow-left me-1"></i>
                                Voltar
                            </a>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                Salvar serviço
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
