{% extends 'barber_grid/base.html' %}

{% block title %}
    Agendamento | Barber Grid
{% endblock %}

{% block content %}

<div class="container py-4">

    <h1>Agendamento</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <div class="mb-4 input-group">

        <button type="button"
                class="btn btn-outline-secondary"
                id="data-anterior">

            <i class="bi bi-chevron-left"></i>

        </button>

        <input class="form-control"
               type="date"
               id="data"
               value="{{ data_atual }}">

        <button type="button"
                class="btn btn-outline-secondary"
                id="data-proxima">

            <i class="bi bi-chevron-right"></i>

        </button>

    </div>

    <div id="mensagem-horarios"></div>

    <div class="mb-3 card"
         id="card-barbeiro"
         style="display: none">

        <div class="d-flex align-items-center gap-2 card-header">

            <i class="bi bi-person-circle text-secondary align-middle"
               style="font-size: 32px; line-height: 1;"></i>

            Barbeiro Felipe

        </div>

        <div class="d-flex flex-wrap gap-2 card-body"
             id="horarios">

        </div>

        <form method="POST">

            {% csrf_token %}

            <input type="hidden"
                   name="data"
                   value="{{ data }}">

        </form>

    </div>

</div>

<script>

const div_horarios =
    document.getElementById("horarios");

const campoData =
    document.getElementById("data");

const botaoAnterior =
    document.getElementById("data-anterior");

const botaoProxima =
    document.getElementById("data-proxima");

const cardBarbeiro =
    document.getElementById("card-barbeiro");

const mensagemHorarios =
    document.getElementById("mensagem-horarios");


cardBarbeiro.style.display = "none";


campoData.addEventListener("change", () => {

    const data = campoData.value;

    div_horarios.innerHTML = "";

    mensagemHorarios.innerHTML = "";

    cardBarbeiro.style.display = "none";


    fetch(`/horarios-disponiveis/?data=${data}`)

        .then(resposta => resposta.json())

        .then(dados => {

            console.log(
                "HORÁRIOS RECEBIDOS:",
                dados.horarios_disponiveis
            );


            if (dados.horarios_disponiveis.length === 0) {

                const alerta =
                    document.createElement("div");

                alerta.setAttribute(
                    "role",
                    "alert"
                );

                alerta.className =
                    "fade d-flex align-items-center alert alert-info show";


                alerta.innerHTML = `

                    Sem horários livres neste dia.

                    <button
                        type="button"
                        id="ver-dia-seguinte"
                        class="ms-auto btn btn-outline-primary btn-sm">

                        Ver o dia seguinte

                    </button>

                `;


                mensagemHorarios.appendChild(alerta);


                const botaoDiaSeguinte =
                    document.getElementById(
                        "ver-dia-seguinte"
                    );


                botaoDiaSeguinte.addEventListener(
                    "click",
                    () => {

                        botaoProxima.click();

                    }
                );


                return;

            }


            cardBarbeiro.style.display = "block";


            dados.horarios_disponiveis.forEach(
                horario => {

                    const card =
                        document.createElement("button");

                    card.type = "button";

                    card.className =
                        "btn btn-outline-primary";

                    card.innerHTML =
                        `<p class="mb-0">${horario}</p>`;


                    card.addEventListener(
                        "click",
                        () => {

                            window.location.href =
                                `/confirmar-agendamento/{{ servico.id }}?data=${data}&horario=${horario}`;

                        }
                    );


                    div_horarios.appendChild(card);

                }
            );

        });

});


botaoAnterior.addEventListener(
    "click",
    () => {

        const data =
            new Date(
                campoData.value + "T00:00:00"
            );

        data.setDate(
            data.getDate() - 1
        );

        campoData.value =
            data.toISOString().split("T")[0];

        campoData.dispatchEvent(
            new Event("change")
        );

    }
);


botaoProxima.addEventListener(
    "click",
    () => {

        const data =
            new Date(
                campoData.value + "T00:00:00"
            );

        data.setDate(
            data.getDate() + 1
        );

        campoData.value =
            data.toISOString().split("T")[0];

        campoData.dispatchEvent(
            new Event("change")
        );

    }
);


campoData.dispatchEvent(
    new Event("change")
);

</script>

{% endblock %}
