{% load static %}

<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
     <link rel="stylesheet" href="https://cloudflare.com" />
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
 <nav class="text-center">
  <img id="imagem_logotipo" src="{% static 'images/logo_tema_escuro.png' %}">
     <a class="navbar-brand" href="{% url 'setup' %}">Barber Grid
     </a>
      <a class="text-center">Alpha</a>
 </nav>
<main>
    <h1>Agendamento</h1>
    {% if messages %}
    {% for message in messages %}
    <p>{{message}}</p>
    {% endfor %}
    {% endif%}

    <form method="POST">
        {% csrf_token %}

        <label for="data">Escolha a data:</label>

        <input
            type="date"
            id="data"
            name="data"
            required
        >
        <div>
            <label for="horario">Escolha um horário:
            <select name="horario">
              {% for horario in horarios_disponiveis %}
              <option value="{{horario}}">{{horario}}</option>
              {% endfor %}
            </select>
            </label>

        

        <button type="submit">Agendar</button>
        </div>
        
    </form>
</main>

</body>
<script src="script.js"></script>
</html>
