{% load static %}

<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
     <link rel="stylesheet" href="https://cloudflare.com" />
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

</head>

<body class="bg-body text-body">
 <nav data-bs-theme="dark" class="navbar navbar-expand-lg navbar-light bg-black"><div class="container"><a class="navbar-brand" href="{% url 'inicio' %}" data-discover="true"><img height="32" class="me-2" src="{% static 'images/favicon.ico' %}">Barber Grid</a><button aria-controls="menu" type="button" aria-label="Toggle navigation" class="navbar-toggler collapsed"><span class="navbar-toggler-icon"></span></button><div class="navbar-collapse collapse" id="menu"><div class="me-auto navbar-nav"><a class="nav-link" href="{% url 'inicio' %}" data-discover="true">Início</a><a class="nav-link active" href="{% url 'pagina_servicos' %}" data-discover="true" aria-current="page">Agendar</a><a class="nav-link" href="{% url 'usuario_historico' %}" data-discover="true">Minhas reservas</a></div><div class="navbar-nav"><div class="nav-item dropdown"><a aria-expanded="false" role="button" class="dropdown-toggle nav-link" tabindex="0" href="#"><i class="bi bi-person-circle text-secondary align-middle" style="font-size: 24px; line-height: 1;"></i>André</a></div></div></div></div></nav>
<main>
    <div class="container py-4">

        <h1>Agendamento</h1>

        {% if messages %}
            {% for message in messages %}
                <p>{{message}}</p>
            {% endfor %}
        {% endif %}

        <div class="mb-4 input-group">
            <button type="button" class="btn btn-outline-secondary" id="data-anterior">
                <i class="bi bi-chevron-left"></i>
            </button>

            <input class="form-control" type="date" id="data" value="{{data_atual}}">

            <button type="button" class="btn btn-outline-secondary" id="data-proxima">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>

        <div id="mensagem-horarios"></div>

        <div class="mb-3 card" id="card-barbeiro" style="display: none">

            <div class="d-flex align-items-center gap-2 card-header">
                <i class="bi bi-person-circle text-secondary align-middle"
                   style="font-size: 32px; line-height: 1;"></i>
                Barbeiro Felipe
            </div>

            <div class="d-flex flex-wrap gap-2 card-body" id="horarios"></div>

            <form method="GET">
                <form method="POST">
                    {% csrf_token %}

                    <div>
                        <input type="hidden" name="data" value="{{ data }}">
                    </div>

                </form>
        </div>

    </div>
</main>

</body>
<script src="{% static 'js/script.js' %}"></script>
<script>
const div_horarios = document.getElementById("horarios")
const campoData = document.getElementById("data");
const paragrafo = document.createElement("p");
paragrafo.innerText = "Selecione um horário";
const botaoAnterior = document.getElementById('data-anterior')
const botaoProxima = document.getElementById('data-proxima')
const cardBarbeiro = document.getElementById("card-barbeiro");
cardBarbeiro.style.display = "none";
const mensagemHorarios = document.getElementById("mensagem-horarios");





campoData.addEventListener("change", () => {
    const data = campoData.value;
    div_horarios.innerHTML = ""
    mensagemHorarios.innerHTML = "";
    cardBarbeiro.style.display = "none";
    

    

    fetch(`/horarios-disponiveis/?data=${data}`)

        .then(resposta => resposta.json())
        .then(dados => {
            if (dados.horarios_disponiveis.length > 0) {
                cardBarbeiro.style.display = "block";
            }

            console.log("HORÁRIOS RECEBIDOS:", dados.horarios_disponiveis);

            if (dados.horarios_disponiveis.length === 0) {
            const alerta = document.createElement("div");

            alerta.setAttribute("role", "alert");
            alerta.className = "fade d-flex align-items-center alert alert-info show";

            alerta.innerHTML = `
            Sem horários livres neste dia.
            <button type="button" id="ver-dia-seguinte" class="ms-auto btn btn-outline-primary btn-sm">
                Ver o dia seguinte
            </button>
            `;

            mensagemHorarios.appendChild(alerta);

            const botaoDiaSeguinte = document.getElementById("ver-dia-seguinte");
            botaoDiaSeguinte.addEventListener("click", () => {
            botaoProxima.click();
            });
            return;
        }
             console.log("RESPOSTA DO DJANGO:", dados);
            dados.horarios_disponiveis.forEach(horario => {
            console.log(horario);
            
            const card = document.createElement('button')
            div_horarios.appendChild(card)
            card.className = "btn btn-outline-primary"
            card.innerHTML = `<p>${horario}</p>`;

            card.addEventListener("click", () => {
                window.location.href = `/confirmar-agendamento/{{ servico.id }}?data=${data}&horario=${horario}`;
            });

            div_horarios.appendChild(card);

            
            
            
            
         
            
           
});



        });
});

botaoAnterior.addEventListener("click", () => {
    const data = new Date(campoData.value + "T00:00:00");

    data.setDate(data.getDate() - 1);

    campoData.value = data.toISOString().split("T")[0];

    campoData.dispatchEvent(new Event("change"));
});
botaoProxima.addEventListener("click", () => {
    const data = new Date(campoData.value + "T00:00:00");

    data.setDate(data.getDate() + 1);

    campoData.value = data.toISOString().split("T")[0];

    campoData.dispatchEvent(new Event("change"));
});

campoData.dispatchEvent(new Event("change"));


</script>
</html>
