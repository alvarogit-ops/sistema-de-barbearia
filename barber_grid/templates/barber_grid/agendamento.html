{% extends 'barber_grid/base.html' %}

{% block title %}
    Agendamento | Barber Grid
{% endblock %}

{% block content %}

<div class="container py-4">

    <h1>Agendamento</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <div class="mb-4 input-group">

        <button type="button"
                class="btn btn-outline-secondary"
                id="data-anterior">

            <i class="bi bi-chevron-left"></i>

        </button>

        <input class="form-control"
               type="date"
               id="data"
               value="{{ data_atual }}">

        <button type="button"
                class="btn btn-outline-secondary"
                id="data-proxima">

            <i class="bi bi-chevron-right"></i>

        </button>

    </div>

    <div id="mensagem-horarios"></div>

    <div class="mb-3 card"
         id="card-barbeiro"
         style="display: none">

        <div class="d-flex align-items-center gap-2 card-header">

            <i class="bi bi-person-circle text-secondary align-middle"
               style="font-size: 32px; line-height: 1;"></i>

            Barbeiro Felipe

        </div>

        <div class="d-flex flex-wrap gap-2 card-body"
             id="horarios">

        </div>

        <form method="POST">

            {% csrf_token %}

            <input type="hidden"
                   name="data"
                   value="{{ data }}">

        </form>

    </div>

</div>

<script>
const div_horarios = document.getElementById("horarios");
const campoData = document.getElementById("data");
const botaoAnterior = document.getElementById("data-anterior");
const botaoProxima = document.getElementById("data-proxima");
const cardBarbeiro = document.getElementById("card-barbeiro");
const mensagemHorarios = document.getElementById("mensagem-horarios");

// Feriados nacionais de data fixa: mês-dia
const feriados = [
    "01-01",
    "04-21",
    "05-01",
    "09-07",
    "10-12",
    "11-02",
    "11-15",
    "11-20",
    "12-25"
];

function carregarHorarios() {
    const data = campoData.value;

    div_horarios.innerHTML = "";
    mensagemHorarios.innerHTML = "";
    cardBarbeiro.style.display = "none";

    if (!data) return;

    const partesData = data.split("-");
    const mesDia = `${partesData[1]}-${partesData[2]}`;

    if (feriados.includes(mesDia)) {
        mensagemHorarios.innerHTML = `
            <div class="alert alert-warning" role="alert">
                Não haverá atendimento neste dia, pois é feriado nacional.
            </div>
        `;
        return;
    }

    fetch(`/horarios-disponiveis/?data=${data}`)
        .then(resposta => {
            if (!resposta.ok) {
                throw new Error("Não foi possível carregar os horários.");
            }
            return resposta.json();
        })
        .then(dados => {
            if (dados.horarios_disponiveis.length === 0) {
                mensagemHorarios.innerHTML = `
                    <div class="alert alert-info" role="alert">
                        Sem horários livres neste dia.
                        <button
                            type="button"
                            id="ver-dia-seguinte"
                            class="ms-2 btn btn-outline-primary btn-sm">
                            Ver o dia seguinte
                        </button>
                    </div>
                `;

                document.getElementById("ver-dia-seguinte")
                    .addEventListener("click", () => botaoProxima.click());

                return;
            }

            cardBarbeiro.style.display = "block";

            dados.horarios_disponiveis.forEach(horario => {
                const card = document.createElement("button");
                card.type = "button";
                card.className = "btn btn-outline-primary";
                card.textContent = horario;

                card.addEventListener("click", () => {
                    window.location.href =
                        `/confirmar-agendamento/{{ servico.id }}?data=${data}&horario=${horario}`;
                });

                div_horarios.appendChild(card);
            });
        })
        .catch(erro => {
            mensagemHorarios.innerHTML = `
                <div class="alert alert-danger" role="alert">
                    Erro ao carregar os horários. Tente novamente.
                </div>
            `;
            console.error(erro);
        });
}

campoData.addEventListener("change", carregarHorarios);

botaoAnterior.addEventListener("click", () => {
    const data = new Date(campoData.value + "T12:00:00");
    data.setDate(data.getDate() - 1);
    campoData.value = formatarData(data);
    carregarHorarios();
});

botaoProxima.addEventListener("click", () => {
    const data = new Date(campoData.value + "T12:00:00");
    data.setDate(data.getDate() + 1);
    campoData.value = formatarData(data);
    carregarHorarios();
});

function formatarData(data) {
    const ano = data.getFullYear();
    const mes = String(data.getMonth() + 1).padStart(2, "0");
    const dia = String(data.getDate()).padStart(2, "0");
    return `${ano}-${mes}-${dia}`;
}

carregarHorarios();
</script>
{% endblock %}
