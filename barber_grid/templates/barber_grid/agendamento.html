{% extends 'barber_grid/base.html' %}

{% block title %}
    Agendamento | Barber Grid
{% endblock %}

{% block content %}

<div class="container py-4">

    <h1>Agendamento</h1>

    {% for message in messages %}
        <div class="alert {% if message.level == 40 %}alert-danger{% else %}alert-info{% endif %}"
             role="alert">
            {{ message }}
        </div>
    {% endfor %}

    <div class="mb-4 input-group">

        <button type="button"
                class="btn btn-outline-secondary"
                id="data-anterior"
                aria-label="Dia anterior">

            <i class="bi bi-chevron-left"></i>

        </button>

        <input class="form-control"
               type="date"
               id="data"
               min="{{ data_atual }}"
               value="{{ data|default:data_atual }}">

        <button type="button"
                class="btn btn-outline-secondary"
                id="data-proxima"
                aria-label="Próximo dia">

            <i class="bi bi-chevron-right"></i>

        </button>

    </div>

    <div id="mensagem-horarios"></div>

    <div class="mb-3 card"
         id="card-barbeiro"
         style="display: none">

        <div class="d-flex align-items-center gap-2 card-header">

            <i class="bi bi-person-circle text-secondary align-middle"
               style="font-size: 32px; line-height: 1;"></i>

            Barbeiro Felipe

        </div>

        <div class="d-flex flex-wrap gap-2 card-body"
             id="horarios">

        </div>

    </div>

</div>

<script>
const URL_HORARIOS = "{% url 'horarios_disponiveis' %}";
const URL_CONFIRMAR = "{% url 'confirmar_agendamento' servico.id %}";
const SERVICO_ID = "{{ servico.id }}";

const divHorarios = document.getElementById("horarios");
const campoData = document.getElementById("data");
const botaoAnterior = document.getElementById("data-anterior");
const botaoProxima = document.getElementById("data-proxima");
const cardBarbeiro = document.getElementById("card-barbeiro");
const mensagemHorarios = document.getElementById("mensagem-horarios");

function mostrarAlerta(tipo, html) {
    mensagemHorarios.innerHTML =
        `<div class="alert alert-${tipo}" role="alert">${html}</div>`;
}

function carregarHorarios() {
    const data = campoData.value;

    divHorarios.innerHTML = "";
    mensagemHorarios.innerHTML = "";
    cardBarbeiro.style.display = "none";

    if (!data) return;

    const params = new URLSearchParams({ data: data, servico: SERVICO_ID });

    fetch(`${URL_HORARIOS}?${params.toString()}`)
        .then(resposta => {
            if (!resposta.ok) {
                throw new Error("Não foi possível carregar os horários.");
            }
            return resposta.json();
        })
        .then(dados => {
            // Feriados vêm do backend (única fonte de verdade).
            if (dados.feriado) {
                mostrarAlerta(
                    "warning",
                    "Não haverá atendimento neste dia, pois é feriado nacional."
                );
                return;
            }

            if (dados.horarios_disponiveis.length === 0) {
                mostrarAlerta(
                    "info",
                    `Sem horários livres neste dia.
                     <button type="button"
                             id="ver-dia-seguinte"
                             class="ms-2 btn btn-outline-primary btn-sm">
                         Ver o dia seguinte
                     </button>`
                );

                document.getElementById("ver-dia-seguinte")
                    .addEventListener("click", () => botaoProxima.click());

                return;
            }

            cardBarbeiro.style.display = "block";

            dados.horarios_disponiveis.forEach(horario => {
                const botao = document.createElement("button");
                botao.type = "button";
                botao.className = "btn btn-outline-primary";
                botao.textContent = horario;

                botao.addEventListener("click", () => {
                    const destino = new URLSearchParams({
                        data: data,
                        horario: horario
                    });
                    window.location.href =
                        `${URL_CONFIRMAR}?${destino.toString()}`;
                });

                divHorarios.appendChild(botao);
            });
        })
        .catch(erro => {
            mostrarAlerta(
                "danger",
                "Erro ao carregar os horários. Tente novamente."
            );
            console.error(erro);
        });
}

function formatarData(data) {
    const ano = data.getFullYear();
    const mes = String(data.getMonth() + 1).padStart(2, "0");
    const dia = String(data.getDate()).padStart(2, "0");
    return `${ano}-${mes}-${dia}`;
}

function mudarDia(diferenca) {
    if (!campoData.value) return;

    const data = new Date(campoData.value + "T12:00:00");
    data.setDate(data.getDate() + diferenca);

    const novaData = formatarData(data);

    // Não deixa voltar para antes de hoje.
    if (campoData.min && novaData < campoData.min) return;

    campoData.value = novaData;
    carregarHorarios();
}

campoData.addEventListener("change", carregarHorarios);
botaoAnterior.addEventListener("click", () => mudarDia(-1));
botaoProxima.addEventListener("click", () => mudarDia(1));

carregarHorarios();
</script>
{% endblock %}
