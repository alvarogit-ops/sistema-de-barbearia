 </nav>
    <div class="container">

        <div class="col-sm-3 mb-3 mb-sm-0">

    </div>
    </div>
  
    


    </div>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/locales/pt-br.global.min.js"></script>
        <script>
        document.addEventListener('DOMContentLoaded', function(){
            let dataSelecionada
            const calendarE1 = document.getElementById('calendar')
            const calendar = new FullCalendar.Calendar(calendarE1, {
                initialView: 'dayGridMonth',
                locale: 'pt-br',
                dateClick: function(info){
                    console.log(info.dateStr)
                    
                    let novaData = document.querySelector(`[data-date="${info.dateStr}"]`)
                    console.log(novaData)  
                                 

                    if (dataSelecionada){
                        dataSelecionada.classList.remove('data-selecionada')
                    }
                    novaData.classList.add('data-selecionada')
                    console.log(novaData.classList)     
                    
                    

                   dataSelecionada = novaData

                }
            })
            calendar.render()

            dataSelecionada = document.querySelector('.fc-day-today')
        
            

            dataSelecionada.classList.add('data-selecionada')
        })

        const temaEscuro = window.matchMedia('(prefers-color-scheme: dark)');
        function aplicarTema(escuro) {
          document.documentElement.setAttribute(
               "data-bs-theme",
              escuro ? "dark": "light",
            );
        }

        

        

        aplicarTema(temaEscuro.matches);

        temaEscuro.addEventListener("change", (evento) => {
            aplicarTema(evento.matches);
        });


        </script>
  </head>
  </body>
  </html>
