{% extends 'barber_grid/base_admin.html' %}

{% block title %}Dados do negócio | Barber Grid{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <h2 class="mb-4">Dados do negócio</h2>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome da barbearia
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        class="form-control"
                        maxlength="100"
                        placeholder="Ex.: Barber Grid"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="3"
                        class="form-control"
                        placeholder="Descreva os serviços e diferenciais da barbearia."
                    ></textarea>
                </div>

                <div class="mb-3">
                    <label for="logo" class="form-label">
                        Logo da barbearia
                    </label>

                    <input
                        type="file"
                        id="logo"
                        name="logo"
                        class="form-control"
                        accept="image/*"
                    >

                    <div class="form-text">
                        Selecione uma imagem para representar sua barbearia.
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        Salvar
                    </button>

                    <button
                        type="reset"
                        class="btn btn-outline-secondary"
                    >
                        Limpar formulário
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
{% endblock %}
