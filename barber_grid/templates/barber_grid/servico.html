{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adicionar Serviço</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/estilo.css' %}"
    >
</head>

<body class="bg-body text-body">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">

            <a class="navbar-brand" href="#">
                Barber Grid
            </a>

            <div class="navbar-nav ms-auto">

                <a
                    class="nav-link"
                    href="{% url 'historico_agendamentos' %}"
                >
                    Histórico de agendamentos
                </a>

                <a
                    class="nav-link"
                    href="{% url 'servico' %}"
                >
                    Adicionar serviço
                </a>

            </div>

        </div>
    </nav>


    <main class="container py-5">

        <h1 class="mb-4">
            Adicionar serviço
        </h1>

        {% for message in messages %}
            <div class="alert alert-success">
                {{ message }}
            </div>
        {% endfor %}

        <div class="card">

            <div class="card-body">

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label
                            for="nome_servico"
                            class="form-label"
                        >
                            Nome do serviço
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nome_servico"
                            name="nome_servico"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label
                            for="preco"
                            class="form-label"
                        >
                            Preço
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="preco"
                            name="preco"
                            step="0.01"
                            min="0"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label
                            for="duracao_minutos"
                            class="form-label"
                        >
                            Duração em minutos
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="duracao_minutos"
                            name="duracao_minutos"
                            min="1"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label
                            for="imagem"
                            class="form-label"
                        >
                            Imagem do serviço
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="imagem"
                            name="imagem"
                        >
                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Adicionar serviço
                    </button>

                </form>

            </div>

        </div>

    </main>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
