```html
{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

    <!-- CSS próprio -->
    <link
        rel="stylesheet"
        href="{% static 'css/estilo.css' %}"
    >

    <!-- Favicon -->
    <link
        rel="shortcut icon"
        type="image/png"
        href="{% static 'images/favicon.ico' %}"
    >

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&family=Montserrat:wght@100..900&family=Tangerine:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <title>Login | Barber Grid</title>
</head>


<body class="bg-body text-body">

    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <!-- Logo -->
                        <div class="text-center mb-4">

                            <img
                                src="{% static 'images/logo_tema_escuro.png' %}"
                                alt="Barber Grid"
                                class="img-fluid mb-3"
                                style="max-height: 60px;"
                            >

                            <h1 class="h3 fw-bold mb-1">
                                Login
                            </h1>

                            <p class="text-body-secondary mb-0">
                                Entre na sua conta
                            </p>

                        </div>


                        <!-- Mensagens -->
                        {% if messages %}

                            {% for message in messages %}

                                <div
                                    class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}"
                                    role="alert"
                                >
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}


                        <!-- Formulário -->
                        <form method="POST" action="#">

                            {% csrf_token %}


                            <!-- Email -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Email
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>

                                    <input
                                        type="email"
                                        name="email"
                                        id="email"
                                        class="form-control"
                                        autocomplete="email"
                                        required
                                    >

                                </div>

                            </div>


                            <!-- Senha -->
                            <div class="mb-4">

                                <label
                                    for="senha"
                                    class="form-label"
                                >
                                    Senha
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        name="senha"
                                        id="senha"
                                        class="form-control"
                                        autocomplete="current-password"
                                        required
                                    >

                                </div>

                            </div>


                            <!-- Botão -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                <i class="bi bi-box-arrow-in-right"></i>
                                Entrar
                            </button>

                        </form>


                        <!-- Registro -->
                        <div class="text-center mt-4">

                            <p class="text-body-secondary mb-2">
                                Ainda não possui uma conta?
                            </p>

                            <a
                                href="{% url 'registro' %}"
                                class="btn btn-outline-secondary w-100"
                            >
                                <i class="bi bi-person-plus"></i>
                                Criar uma conta
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Tema -->
    <script>

        const temaEscuro =
            window.matchMedia('(prefers-color-scheme: dark)');

        function aplicarTema(escuro) {

            document.documentElement.setAttribute(
                'data-bs-theme',
                escuro ? 'dark' : 'light'
            );

        }

        aplicarTema(temaEscuro.matches);

        temaEscuro.addEventListener(
            'change',
            (evento) => aplicarTema(evento.matches)
        );

    </script>

    <script src="{% static 'js/script.js' %}"></script>

</body>

</html>
```
