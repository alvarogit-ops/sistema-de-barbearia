{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" type="image/png"
          href="{% static 'images/favicon.ico' %}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="{% static 'css/estilo.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <title>Login | Barber Grid</title>
</head>

<body class="bg-body text-body">

    <main class="login-page">

        <div class="login-container">

            <div class="login-brand">
                <a href="{% url 'inicio' %}">
                    <img
                        id="imagem_logotipo"
                        src="{% static 'images/logo_tema_escuro.png' %}"
                        data-logo-escuro="{% static 'images/logo_tema_escuro.png' %}"
                        data-logo-claro="{% static 'images/logo_tema_claro.png' %}"
                        alt="Barber Grid"
                    >
                </a>

                <h1>Barber Grid</h1>
            </div>

            <div class="login-card">

                <div class="login-header">
                    <h2>Bem-vindo</h2>
                    <p>Entre na sua conta para continuar.</p>
                </div>

                {% for message in messages %}
                    {% if message.level == 40 %}
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-circle me-2"></i>
                            {{ message }}
                        </div>
                    {% endif %}
                {% endfor %}

                <form method="POST" action="#">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Email
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input
                                type="email"
                                name="username"
                                id="username"
                                class="form-control"
                                placeholder="seu@email.com"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label">
                            Senha
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                name="senha"
                                id="senha"
                                class="form-control"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 login-button">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Entrar
                    </button>
                </form>

                <div class="login-divider">
                    <span>ou</span>
                </div>

                <div class="login-register">
                    <span>Ainda não possui uma conta?</span>
                    <a href="{% url 'registro' %}">
                        Criar uma conta
                    </a>
                </div>

            </div>

            <a href="{% url 'inicio' %}" class="login-back">
                <i class="bi bi-arrow-left me-1"></i>
                Voltar para o início
            </a>

        </div>

    </main>

    <script>
        const temaEscuro = window.matchMedia('(prefers-color-scheme: dark)');

        function aplicarTema(escuro) {
            document.documentElement.setAttribute(
                "data-bs-theme",
                escuro ? "dark" : "light"
            );

            const logo = document.getElementById("imagem_logotipo");

            logo.src = escuro
                ? logo.dataset.logoEscuro
                : logo.dataset.logoClaro;
        }

        aplicarTema(temaEscuro.matches);

        temaEscuro.addEventListener("change", (evento) => {
            aplicarTema(evento.matches);
        });
    </script>

</body>
</html>
