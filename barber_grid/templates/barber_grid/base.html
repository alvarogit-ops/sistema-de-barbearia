{% load static %}

<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Barber Grid{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
     <link rel="stylesheet" href="https://cloudflare.com" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

<nav data-bs-theme="dark"
     class="navbar navbar-expand-lg">

<div class="container">

    <a class="navbar-brand d-flex align-items-center"
   href="{% url 'inicio' %}">

    <img height="32"
         class="me-2"
         id="logo"
         src="{% static 'images/logo_tema_escuro.png' %}"
         data-logo-escuro="{% static 'images/logo_tema_escuro.png' %}"
         data-logo-claro="{% static 'images/logo_tema_claro.png' %}"
         alt="Barber Grid">

    <h1 class="mb-0">Barber Grid</h1>

    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Abrir menu">

        <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse"
         id="menu">

        <div class="me-auto navbar-nav">

            <a class="nav-link"
               href="{% url 'inicio' %}">
                Início
            </a>

            <a class="nav-link"
               href="{% url 'pagina_servicos' %}">
                Agendar
            </a>

            <a class="nav-link"
               href="{% url 'usuario_historico' %}">
                Minhas reservas
            </a>

        </div>

        <div class="navbar-nav">

            <a class="nav-link"
               href="#">

                <i class="bi bi-person-circle text-secondary align-middle"
                   style="font-size: 24px; line-height: 1;">
                </i>

                {{ request.user.username }}

            </a>

        </div>

    </div>

</div>

</nav>

<main>

{% block content %}
{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const temaEscuro = window.matchMedia(
        '(prefers-color-scheme: dark)'
    );


    function aplicarTema(escuro) {

    document.documentElement.setAttribute(
        "data-bs-theme",
        escuro ? "dark" : "light"
    );

    const logo = document.getElementById("logo");

    logo.src = escuro
        ? logo.dataset.logoEscuro
        : logo.dataset.logoClaro;
}

    aplicarTema(temaEscuro.matches);


    temaEscuro.addEventListener(
        "change",
        (evento) => {

            aplicarTema(evento.matches);

        }
    );

</script>

</body>
</html>
